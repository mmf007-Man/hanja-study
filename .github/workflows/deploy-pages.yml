name: Deploy Static Web App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate textbook and character data
        run: python scripts/validate_data.py

      - name: Build static runtime data chunks
        run: python scripts/build_app_data.py

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Assemble runtime static site (_site)
        run: |
          rm -rf _site
          mkdir -p _site/prototype/stroke-assist/css _site/prototype/stroke-assist/js _site/prototype/stroke-assist/data
          cp -r dist/. _site/
          cp prototype/stroke-assist/index.html _site/prototype/stroke-assist/
          cp -r prototype/stroke-assist/css/. _site/prototype/stroke-assist/css/
          cp -r prototype/stroke-assist/js/. _site/prototype/stroke-assist/js/
          cp prototype/stroke-assist/data/catalog-targets.json _site/prototype/stroke-assist/data/
          cp prototype/stroke-assist/data/review-targets.json _site/prototype/stroke-assist/data/
          cp prototype/stroke-assist/data/sample-strokes.json _site/prototype/stroke-assist/data/
          test -f _site/THIRD-PARTY-NOTICES.md
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
