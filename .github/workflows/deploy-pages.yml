name: Deploy Static Web App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Assemble runtime static site (_site)
        run: |
          rm -rf _site
          mkdir -p _site/css _site/js _site/data
          cp prototype/stroke-assist/index.html _site/
          cp -r prototype/stroke-assist/css/. _site/css/
          cp -r prototype/stroke-assist/js/. _site/js/
          cp prototype/stroke-assist/data/catalog-targets.json _site/data/
          cp prototype/stroke-assist/data/review-targets.json _site/data/
          cp prototype/stroke-assist/data/sample-strokes.json _site/data/
          cp THIRD-PARTY-NOTICES.md _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
